[Steering]
// Speed steering sensitivity information
SwitchSpeed=20	// Speed to switch from low curve to high curve
TopSpeed=100	// Speed at which we are at minimum steering sensitivity

LowMaxRatio=150	// Turning ratio at 0 mph (300 = 3 to 1, amplify steering 3 times)
LowMinRatio=50	// Turning ratio at Switch Speed (50 = .5 to 1, cut steering in half)

// Non-linear steering information
MaxDeadZone=0	// Ignore all input below this level (out of +/- 32767)
MaxCenterZone=0	// Center zone extends up to this level (out of +/- 32767)
CenterZonePct=100	// Set steering to this pct of normal at maximum of center zone

[SteeringKeyboard]
// Speed steering sensitivity information
SwitchSpeed=40	// Speed to switch from low curve to high curve
TopSpeed=100	// Speed at which we are at minimum steering sensitivity

LowMaxRatio=100	// Turning ratio at 0 mph (300 = 3 to 1, amplify steering 3 times)
LowMinRatio=25	// Turning ratio at Switch Speed (50 = .5 to 1, cut steering in half)

XUnwind=8192	// How quickly keyboard releases turns

Ywind=4096		// How quickly keyboard hits the gas/brakes
YUnwind=8192	// How quickly keyboard lets off the gas/brakes

[SteeringDPad]
// Speed steering sensitivity information
SwitchSpeed=50	// Speed to switch from low curve to high curve
TopSpeed=100	// Speed at which we are at minimum steering sensitivity

LowMaxRatio=150	// Turning ratio at 0 mph (300 = 3 to 1, amplify steering 3 times)
LowMinRatio=25	// Turning ratio at Switch Speed (50 = .5 to 1, cut steering in half)

XUnwind=8192	// How quickly DPad releases turns

Ywind=4096	// How quickly DPad hits the gas/brakes
YUnwind=8192	// How quickly DPad lets off the gas/brakes


